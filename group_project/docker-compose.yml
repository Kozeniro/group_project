version: "3.9"

services:
  auth_backend:
    build: .
    container_name: auth_backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - auth_redis
      - auth_mongo

  auth_redis:
    image: redis:7.4
    container_name: auth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  auth_mongo:
    image: mongo:7
    container_name: auth_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
